# intervalle de temps de la simulation
TimeInterval = 0 1e-1
TimeStep = 5e-6     

# intervalle de temps auquel les informations sont donnees (energie, temps de calcul)             
DisplayFrequency = 1e-4
  
# parametres physiques de la corde                                                                
# String = L A rho T0 E I G k_prime amo(0) amo(1) Nx is_sruck K_hammer R_hammer                   
String = 1.05 9.7993e-7 7850 880  2.02e+11 7.6416e-14 7.77e10 0.85 7.69e-3 5.5e-2 1.0 40 1 4.3e+06 0  

# excitation                               
 Hammer = YES 0.09 0.115 9.0 2.4 0.02 2011 0.02 -0.02001 1e-10 


BridgeStringPolarisationAngle = 20 

Impedance0 = example/PIANO/BRIDGE/M3.txt example/PIANO/BRIDGE/KU2.txt example/PIANO/BRIDGE/CU2.txt
Impedance1 = example/PIANO/BRIDGE/M3.txt example/PIANO/BRIDGE/KV1.txt example/PIANO/BRIDGE/CV1.txt

# parametres de discretisation en temps                                                           
StringSolver = THETA_NL_QUARTER  0.0833333333 0.25                                                
StringPermutations = PERMUT_ALL     

# donnees initiales sur la corde                                                                  
StringInitialData = NONE    

# sismogramme d'un point de la corde
StringSismo = 0.06 
StringSismoTimeGrid = 0.0 1.0 5e-5

DirectoryOutputString = ./

FileOutputString = SismoLM_StringBridge.txt SismoHammerStringBridge.txt ForceMarteauStringBridge.txt EnergyCouplageBridge.txt
FileOutputSismoString = SismoStringStringBridge_ SismoLastPointStringBridge_ SismoCrushStringBridge_ 

# sortie d'un fichier avec l'energie 
Energy = 0 1.0 1e-5

# parametre de convergence de la methode de Newton                                                
NewtonParam = 1e-12 20 1e-9

DataNonRegressionTest = StringBridgeStiffNL2T.x 0 1

