TypeElement = QUADRANGLE_LOBATTO
TypeEquation = TIME_REISSNER_MINDLIN
# path where the meshes are stored
MeshPath = /home/durufle/Maillages/Surf/Piano/
# frequency of the temporal source
# Frequency = a b means that the pulsation omega = 2*pi*a + b 
Frequency = 1.0 0.0

# for a regular mesh, put FileMesh = REGULAR nb_x xmin xmax ymin ymax  ref_media  ref1 ref2 ref3 ref4
# nb_x : number of subdivisions along x
# ref_media reference of the elements (quadrilaterals or triangles)
# ref1, ref2, ref3, ref4 references of the edges y = ymin, x = xmax, y = ymax and x = xmin
FileMesh = REGULAR 21 -10.0  10.0  -10.0  10.0  1  3  3  3  3
#FileMesh = soundboard-ribs.mesh
#FileMesh = SteinwayModelD.mesh

TypeMesh = QUAD
# order of space approximation
OrderDiscretization = 1

InitialCondition = USER -1 0.8 0.1 1.0

# StorageMatrix = YES Mat.dat
# valeurs propres
# Eigenvalue = YES SHIFTED sigma nombre_modes
# Eigenvalue = YES INVERT 100 20
Eigenvalue = YES SHIFTED 100 1
# Eigenvalue = YES CAYLEY 10 20
EigenvalueTolerance = 1e-15

# boundary condition for edges of reference 1
ConditionReference = 3 SUPPORTED 2

# several choices for selecting properties of a media 
# MateriauDielec = ref ISOTROPE rho lambda mu
#MateriauDielec = ref YOUNG_POISSON rho E nu
# MateriauDielec = 1 ORTHOTROPE rho Exx Eyy nu_xy nu_yx Gxy Gxz Gyz Kx Ky
MateriauDielec = 1 ORTHOTROPE 380.0 11.0e9 650.0e6 0.26 0.014 0.66e9 1.2e9 42.0e6 0.85 0.85
MateriauDielec = 2 ORTHOTROPE 380.0 11.0e9 650.0e6 0.26 0.014 0.66e9 1.2e9 42.0e6 0.85 0.85
MateriauDielec = 3 YOUNG_POISSON 500.0 12.0e9 0.4
# MateriauDielec = 4 YOUNG_POISSON 500.0 12.0e9 0.4

ThicknessPlate = 0.048

SismoPlane = AUTO 201 201
# diffracted and total field (in this test case, we compute only total field)
FileOutputPlane = diffracTest.dat EIGEN/soundboard/Steinway/Dirichlet/ModePlaque.dat

SismoMeshVolumetric = AUTO
# files where the snapshots on subdivided mesh are stored
FileOutputMeshVolumetric = diffrac_medit.bb Soundboard.bb

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
# seismogramms are always on ascii format
OutputFormat = BINARY DOUBLE

# we want only the solution U (not the gradient)
ElectricOrMagnetic = -1

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 6

