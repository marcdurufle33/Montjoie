#TypeElement = QUADRANGLE_DG_LOBATTO
TypeElement = QUADRANGLE_DG_GAUSS
TypeEquation = AERO_ACOUSTIC
# path where the meshes are stored
MeshPath = MAILLAGES/
# frequency of the temporal source
# Frequency = a b means that the pulsation omega = 2*pi*a + b 
Frequency = 1.0 0.0

# for a regular mesh, put FileMesh = REGULAR nb_x xmin xmax ymin ymax  ref_media  ref1 ref2 ref3 ref4
# nb_x : number of subdivisions along x
# ref_media reference of the elements (quadrilaterals or triangles)
# ref1, ref2, ref3, ref4 references of the edges y = ymin, x = xmax, y = ymax and x = xmin
FileMesh = disqueCarre.mesh

TypeMesh = QUAD

# order of space approximation
OrderDiscretization = 4

# with penalization, more stability ...
PenalizationDG = -0.5 -0.5

# Dirichlet condition for edges of reference 1 and 3 : u.n = 0
ConditionReference = 1 3 DIRICHLET
# absorbing boundary condition for edges of reference 2 and 4
ConditionReference = 2 4 ABSORBING

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 radius
# where (x0, y0) is the center of the gaussian, radius is so that f(radius) = 1e-6
TypeSource = SRC_VOLUME GAUSSIAN -3.0 0.0 1.0

# source is on p, v ? (p u_0 v_0)
Polarization = 1.0  0  0

# each index u0, v0, sigma0, rho0, c0 or p0 can be specified 
# - as constant : 0.5 ,
# - as defined on a regular grid : RANDOM xmin xmax ymin ymax troncX troncY offset amplitude file
#   in this case, troncX and troncY are coefficients in order to smooth the index 
#   so that it will be equal to 0 near the boundaries of the grid.
#   If you don't want to smooth the index, put 0
# - as defined on a mesh : MESH file_mesh offset amplitude file_data order
#   order is the order of approximation used to define the index on the mesh
MateriauDielec = 1 ISOTROPE MESH MAILLAGES/disqueCarre.mesh 0 0.5 example/aero2D/flowDisque.elb 4 0.5 \
                            0.0 0.0 1.0 1.414213562373 1.0

TypeSolver = AUTO

# initial time, final time, and step time between each snapshot
# tend tbegin deltat
ParametersOutputPlane = 0.0 10.0 2.0
# snapshots on all the mesh
SismoPlane = AUTO 200 200
# diffracted and total field (in this test case, we compute only total field)
FileOutputPlane = diffracTest.dat aeroDisqueGrid.dat

# tend tbegin deltat for seismogramms
ParametersOutputPoint = 0.0 40.0 0.02
# diffracted and total field (in this test case, we compute only total field)
FileOutputPoint = diffracPoint.dat totalPoint_AeroDisque.dat
# you can add as many points you want, all the results will be stored in the same file totalPoint.dat
SismoPoint = 1.5 0.0
SismoPoint = -1.5 0.0

# snapshots on a subdivided mesh (AUTO means that number of subdivisions will be equal to order of approximation)
SismoMeshVolumetric = AUTO
# files where the snapshots on subdivided mesh are stored
FileOutputMeshVolumetric = diffracAero.bb aeroDisque.bb
# tbegin tend deltat 
ParametersOutputMeshVolumetric = 0.0 10.0 2.0

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
# seismogramms are always on ascii format
OutputFormat = BINARY DOUBLE

# we want all the unknowns of the solution (p, v_x and v_y)
ElectricOrMagnetic = -2

# step time deltat
TimeStep = 0.01

# initial time of the experience, final time
TimeInterval = -0.2 10.0

# fourth order Runge-Kutta scheme
OrderTimeScheme = 4 RUNGE_KUTTA
#OrderTimeScheme = 50 TALEZER 150 100

# temporal dependance of the source
TemporalSource = RICKER

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 6

DataNonRegressionTest = aero2D.x 4 8
