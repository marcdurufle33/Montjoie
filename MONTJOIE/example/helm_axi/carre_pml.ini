# type of finite element
TypeElement = TRIANGLE_RADAU

# type of equation
TypeEquation = HELMHOLTZ

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 2.0 0.0

# IndicentAngle = theta phi of the indicent plane wave
# wave vector k = (k sin teta cos phi, k sin teta sin phi, k cos teta)
IncidentAngle = 180.0 0.0

# file where the mesh is stored (path is added -> MAILLAGES/DemiDisquePML.mesh)
FileMesh = demi_carre.mesh

# order of space approximation 
OrderDiscretization = 10

# NumberModes = SINGLE n
NumberModes = 0

# Neumann and periodic boundary conditions for instance
ConditionReference = 2 NEUMANN
ConditionReference = 1 3 PERIODICITY

# On the axis, a fictitious Neumann boundary condition is set
ConditionReference = 4 NEUMANN

# convected Helmholtz equation
AddFlowTerm = YES

# MateriauDielec = ref ISOTROPE rho mu sigma mr mtheta mz
MateriauDielec = 1 ISOTROPE 1.2 1.5 0.0  0.0 0.0 0.3

# PML layers
AddPML = YES PML_X+Y 1.0 AUTO
DampingPML = 2.0

# Gaussian source
TypeSource = SRC_VOLUME GAUSSIAN 0.0 0.0 0.0  0.5 1.0

# automatic resolution of the linear system (selection of the optimal algorithm)
TypeSolver = DIRECT

# snapshots on three planes intersecting at (0, 0, 0)
SismoGrille = 0 0 0 AUTO 200 200 200
# files where the diffracted and total field will be stored
FileOutputGrille = diffracTestGhost totalCarreConvecHelmAxi

# we want to know the solution U only
ElectricOrMagnetic = -2

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat.dat

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = helmholtz_axi.x 0 8
