# type of finite element
TypeElement = TRIANGLE_RADAU

# type of equation
TypeEquation = HELMHOLTZ

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 0.92 0.0

# IndicentAngle = theta phi of the indicent plane wave
# wave vector k = (k sin teta cos phi, k sin teta sin phi, k cos teta)
IncidentAngle = 180.0 0.0

# file where the mesh is stored (path is added -> MAILLAGES/DemiDisquePML.mesh)
FileMesh = REGULAR_ANISO 11 21 0.0 4.0 -4.0 4.0   1  1 2 3 4

# order of space approximation 
OrderDiscretization = 10

# To solve an isolated mode
NumberModes = SINGLE 3

# Absorbing and periodic boundary conditions for instance
ConditionReference = 2 ABSORBING
ConditionReference = 1 3 PERIODICITY

# On the axis, a fictitious Neumann boundary condition is set
ConditionReference = 4 NEUMANN

# convected Helmholtz equation
AddFlowTerm = YES

# MateriauDielec = ref ISOTROPE rho mu sigma mr mtheta mz
PhysicalMedia = rho 1 ISOTROPE SAME_MESH DATA/demi_carre.mesh 0.0 1.0 DATA/rhoHelmAxi.don 10 1.6
PhysicalMedia = mu 1 ISOTROPE SAME_MESH DATA/demi_carre.mesh 0.0 1.0 DATA/muHelmAxi.don 10 1.52
PhysicalMedia = sigma 1 ISOTROPE SAME_MESH DATA/demi_carre.mesh 0.0 1.0 DATA/sigmaHelmAxi.don 10 0.0
PhysicalMedia = M 1 ISOTROPE SAME_MESH DATA/demi_carre.mesh 0.0 0.2 DATA/mrHelmAxi.don 10 1.0 \
                             SAME_MESH DATA/demi_carre.mesh 0.0 0.2 DATA/mphiHelmAxi.don 10 1.0 \
                             SAME_MESH DATA/demi_carre.mesh 0.0 0.2 DATA/mzHelmAxi.don 10 1.0

# Gaussian source
TypeSource = SRC_DIRAC
OriginePhase = 2.0 0.0 0.0

# automatic resolution of the linear system (selection of the optimal algorithm)
TypeSolver = DIRECT

# snapshots on a 2-D regular grid
SismoPlaneAxi = 1e-12 0.0 -4.0  4.0 0.0 -4.0   1e-12 0.0 4.0  200 400
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputPlaneAxi = diffracTest totalVarPeriodicConvHelm

# we want to know the solution U only
ElectricOrMagnetic = -2

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat.dat

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = helmholtz_axi.x 0 8
