# type of finite element
TypeElement = TRIANGLE_RADAU

# type of equation
TypeEquation = HELMHOLTZ

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 1.0 0.0

# incident angles teta, phi of the incident plane wave
# these angles are in degrees (0, 90, 180 by example)
IncidentAngle = 90.0 90.0

# file where the mesh is stored (path is added -> MAILLAGES/DisqueCond_QUAD.mesh)
FileMesh = couronne_disque_quad.mesh

TypeMesh = QUAD

# order of space approximation 
OrderDiscretization = 10

# curved element
TypeCurve = 1 CIRCLE
TypeCurve = 3 CIRCLE

# boundary condition for edges of reference 1 and 3
ConditionReference = 1 DIRICHLET
ConditionReference = 3 ABSORBING
ConditionReference = 2 4 NEUMANN

# PML layers are added to the domain
# AddPML = YES PML_R thickness AUTO
# or AddPML = YES PML_R thickness nb_layers
# where nb_layers is the number of cells in direction of PML
AddPML = YES PML_R 0.5 AUTO

# damping factor for PML
DampingPML = 4.0

# NumberModes = AUTO epsilon
NumberModes = AUTO 1e-8

# scattering by a plane wave exp(ikx)
TypeSource = SRC_DIFFRACTED_FIELD PLANE_WAVE

# automatic solver
TypeSolver = AUTO

# non-linear solver to solve F_i (X) = Y 
NonLinearSolver = NEWTON 1e-15 50

# snapshots on three planes
SismoGrille = 0.0 0.0 0.0 -2 2 -2 2 -2 2 200 200 200
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputGrille = diffracCirclePMLHelmAxi totalCirclePMLHelmAxi

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution U and gradients
ElectricOrMagnetic = 0

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat_

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 4

DataNonRegressionTest = ./helmholtz_axi.x 0 8
