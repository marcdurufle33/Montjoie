# type of finite element
TypeElement = TRIANGLE_LOBATTO

# type of equation
TypeEquation = HELMHOLTZ

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 0.0 0.0

# incident angle teta of the incident plane wave \vec{k} = (k cos teta, k sin teta)
# this angle is in degrees (0, 90, 180 by example)
IncidentAngle = 0.0

# for a regular mesh, put FileMesh = REGULAR nb_x xmin xmax ymin ymax  ref_media  ref1 ref2 ref3 ref4
# nb_x : number of subdivisions along x
# ref_media reference of the elements (quadrilaterals or triangles)
# ref1, ref2, ref3, ref4 references of the edges y = ymin, x = xmax, y = ymax and x = xmin
FileMesh = REGULAR 21 -6.0  6.0  -6.0  6.0  1  3  3  3  3
#FileMesh = DisqueSeul_QUAD.mesh

TypeMesh = QUAD

# order of space approximation 
OrderDiscretization = 6

# Eigenvalue = YES mode center_spectrum nb_modes
#Eigenvalue = YES SHIFTED 0.5 20

# boundary condition for edges of reference 3
#ConditionReference = 3 DIRICHLET
ConditionReference = 3 NEUMANN

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 radius
# where (x0, y0) is the center of the gaussian, radius is so that f(radius) = 1e-6
TypeSource = SRC_VOLUME GAUSSIAN 0.0 0.0 40.0

# automatic resolution of the linear system (selection of the optimal algorithm)
TypeSolver = AUTO
#TypeResolution = COCG IDENTITY
#Tolerance = 1e-30
#NumberMaxIterations = 10000 10

# non-linear solver to solve
NonLinearSolver = MINPACK 1e-15 50

# snapshots on a 2-D regular grid 200x200
SismoPlane = AUTO 200 200
#SismoPlane = 0 2 0 2  200 200
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputPlane = diffracCarre totalCarre

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution U and gradients
ElectricOrMagnetic = -1

ExplicitMatrixFEM = YES

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat.dat

#ApproximationC = RectangularBSpline 15 15 4 4
#ApproximationC = SameMesh 0 Discontinuous
ApproximationC = SameMesh 2

#RegularizationMethod = LevMarquardtGenuine
RegularizationMethod = NewtonCG max_nr_steps 100
#RegularizationMethod = IRGNM_CG max_nr_steps 100

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 8

