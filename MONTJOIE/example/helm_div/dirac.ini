# type of finite element
TypeElement = TRIANGLE_OPTIMAL_FIRST_FAMILY
# type of equation
TypeEquation = HELMHOLTZ_DIV
# path where the meshes are stored
MeshPath = MAILLAGES/
# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 100.0 0.0
# incident angle teta of the incident plane wave \vec{k} = (k cos teta, k sin teta)
# this angle is in degrees (0, 90, 180 by example)
IncidentAngle = 0.0

# file containing the mesh
FileMesh = DisqueSeul_QUAD.mesh

# if the mesh contains triangles, each triangle is split into three quads
# and quads into four in order to obtain a quadrilateral mesh
TypeMesh = QUAD

# order of space approximation 
OrderDiscretization = 6

RefinementVertex = 0.0 0.0 5 2

# curved elements for the boundary of reference 1
TypeCurve = 1 CIRCLE

# boundary condition for edges of reference 1 and 3
ConditionReference = 1 3 ABSORBING

# MateriauDielec = ref ISOTROPE sigma rho c dp_dx dp_dy
MateriauDielec = 1 ISOTROPE 0.0 2.0 100.0 0.0 0.0

# The source can be a Dirac
TypeSource = SRC_DIRAC

# origin of the Dirac
OriginePhase = 0.0 0.0

# automatic resolution of the linear system (selection of the optimal algorithm)
TypeSolver = AUTO

# non-linear solver used to invert Fj transform
NonLinearSolver = NEWTON 1e-15 50

# snapshots on a 2-D regular grid 200x200
SismoPlane = AUTO 200 200
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputPlane = diffracCarreDiv totalDiracDiv

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution u_x only
ElectricOrMagnetic = 0

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat_

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = helm_hdiv.x 0 8
