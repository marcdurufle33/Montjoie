#! ruby syntax highlighting

# type of finite element
TypeElement = QUADRANGLE_LOBATTO

# type of equation
TypeEquation = VISCOUS_CELL

PhysicalMedia = viscosity 1 1.0
PhysicalMedia = density 1 1.0

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 1 0

# incident angle teta of the incident plane wave \vec{k} = (k cos teta, k sin teta)
# this angle is in degrees (0, 90, 180 by example)
IncidentAngle = 0.0

# for a regular mesh, put FileMesh = REGULAR nb_x xmin xmax ymin ymax  ref_media  ref1 ref2 ref3 ref4
# nb_x : number of subdivisions along x
# ref_media reference of the elements (quadrilaterals or triangles)
# ref1, ref2, ref3, ref4 references of the edges y = ymin, x = xmax, y = ymax and x = xmin
# FileMesh = REGULAR 13 -1.0 1.0 -1.0 1.0  0  4  3  5  3
FileMesh = mur3.mesh

TypeMesh = QUAD

# mur3.mesh contains two circle parts
TypeCurve = 6 CIRCLE
TypeCurve = 8 CIRCLE

# if you need to refine close to a boundary
#RefinementArea = 1 2.0 Ref Isotrope 5 6 7 8

# one additional mesh numbering (for p unknown)
NumberAdditionalNumberings = 1
# u_x, u_y with the numbering 0, p with the numbering 1
UnknownMeshNumbering = 0 0 1

# order of space approximation (for numbering 0)
OrderDiscretization = 5

# order for the additional mesh numbering
# this line must be given after OrderDiscretization
U1_OrderDiscretization = 4

# supported components 0, 1 => Dirichlet condition on u
ConditionReference = 5 6 7 8 SUPPORTED 0 1

# periodic boundary conditions
ConditionReference = 1 3 PERIODICITY
ConditionReference = 2 4 PERIODICITY
UseSameDofsForPeriodicCondition = YES

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 radius
# where (x0, y0) is the center of the gaussian, radius is so that f(radius) = 1e-6
Polarization = 0.0 1.0 0.0
TypeSource = SRC_VOLUME UNIFORM

# automatic solution of the linear system (selection of the optimal algorithm)
TypeSolver = AUTO

# non-linear solver to solve
NonLinearSolver = NEWTON 1e-15 50

# snapshots on a 2-D regular grid
SismoPlane = AUTO 200 200
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputPlane = diffracCarre totalCarre

SismoCircle = 0.5 0.0 0.2 400
SismoCircle = -0.5 0.0 0.2 400
FileOutputCircle = diffracCircle totalCircle

SismoLine = -0.5 0.5 0.2 0.2 400
SismoLine = -0.5 0.5 -0.2 -0.2 400
FileOutputLine = diffracLine totalLine

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution U and gradients
ElectricOrMagnetic = -1

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat_

# Export the exact data, so that we can do post treatment (e.g. compute integrals on the solution...)
WriteSolutionQuadrature = YES totalCarre_sol.dat totalCarre_poids.dat

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 4

# DataNonRegressionTest = helmholtz2D.x 0 8
