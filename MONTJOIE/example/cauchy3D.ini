TypeElement = HEXAHEDRON_LOBATTO
TypeEquation = CAUCHY_POISSON
MeshPath = MAILLAGES/
Frequency = 1.0 0.0
IncidentAngle = 0.0 0

# To use a regular mesh
# FileMesh = REGULAR nbx xmin xmax ymin ymax zmin zmax  ref  ref1 ref2 ref3 ref4 ref5 ref6
# ref1 -> x = xmin, ref2 -> y = ymin, ref3 -> z= zmin, ref4 -> z= zmax, ref5 -> y = ymax, ref6 -> x = xmax
#FileMesh = REGULAR 25 0.0 16.0 -2.0 0.0 0.0 16.0  1  1 3 2 5 4 6 
FileMesh = ilot.mesh

# To extrude a 2-D mesh (only along axis Oz)
# FileMesh = EXTRUDE zmin zmax nbz fichier2D ref z1 z2
# nbz is the number of layers in the Oz direction, (AUTO means that this number
# is automatically chosen to fit the space step of the 2-D mesh)
# if z1 < z2, a hole/dielectric is created (DIELEC to have a dielectric)
# the hole/dielectric is based on elements of reference ref
#FileMesh = EXTRUDE 0.0 16.0 AUTO bassin.mesh -1 1.0 0.0 HOLE

#ConditionReference = 1 3 NEUMANN

# for condition du/dn + 1/g d^2 u/ dt^2 = 0, put ConditionReference = ref IMPEDANCE invG
# where ref is the associated reference on the mesh, invG = 1.0/g
ConditionReference = 1 2 5 6 IMPEDANCE 0.1

# for absorbing boundary condition du/dn + alpha du/dt = 0, put ConditionReference = ref IMPEDANCE alpha
# usually alpha = 1.0
ConditionReference = 4 IMPEDANCE 0.1

ConditionReference = 3 DIRICHLET

# put in this line all the references associated to the condition du/dn + 1/g d^2 u /dt^2
SurfaceFluid = 4
# put in this line all the references associated to the boundary condition
SurfaceAbsorbing = 1 2 5 6

# spatial order of approximation
OrderDiscretization = 4

# TypeSource = SRC_SURFACE GAUSSIAN x0 y0 z0 r0
# source du/dn = h, where h is a gaussian centered on the point (x0,y0,z0) and of radius r0
TypeSource = SRC_VOLUME GAUSSIAN -10000.0 0.0 -1000.0 1000.0

TimeStep = 0.05

TimeInterval = 0.0 100.0

# temporal dependency of the source
TemporalSource = RICKER
#TemporalSource = HARMONIC 100.0
#TemporalSource = SINUS_GAUSSIAN 0.2

# solver used
TypeResolution = COCG MULTIGRID 2 1 1
#TypeResolution = MUMPS

# smoother for multigrid iteration
Smoother = JACOBI 0.5
# direct solver to be used for the coarsest mesh (ILUT or MUMPS)
DirectSolver = ILUT 1e-3 0 100000 1e-2 0.1 1.0 
#DirectSolver = MUMPS

# the second number is the parameter restart for gmres-like algorithm
NumberMaxIterations = 10000  20
Tolerance = 1e-6

# solver used to computation of the display grid
NonLinearSolver = MINPACK 1e-15 50

# Plane where the solution is computed (three points of the plane)
SismoPlane = -32000 -32000 0  32000 -32000 0 -32000  32000 0 200 200
# files where the snapshots on subdivided mesh are stored
FileOutputPlane = diffracIlot totalIlot
ParametersOutputPlane = 0.0 100.0 0.05

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# -1 for all the components (and gradient), 0 for the first component
ElectricOrMagnetic = 0

StorageMatrix = NO mat.dat

PrintLevel = 4

StaticCondensation = NO
