# Gauss-Lobatto finite elements on hexahedrals
TypeElement = HEXAHEDRON_LOBATTO
# acoustic equation to be solved
TypeEquation = ACOUSTIC
# path where the meshes are stored
MeshPath = MAILLAGES/
# frequency of the temporal source
# Frequency = a b means that the pulsation omega = 2*pi*a + b 
Frequency = 1.0 0.0

# file where the ;esh is stored
FileMesh = fente3D.mesh

TypeMesh = HEXA

# order of space approximation
OrderDiscretization = 5

# boundary condition for edges of reference 3
ConditionReference = 1 NEUMANN
ConditionReference = 2 NEUMANN
ConditionReference = 3 ABSORBING

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 z0 radius
# where (x0, y0, z0) is the center of the gaussian, radius is so that f(radius) = 1e-6
TypeSource = SRC_VOLUME GAUSSIAN -1.0 0 0 1

# initial time, final time, and step time between each snapshot
# tend tbegin deltat
ParametersOutputGrille = 0.0 20.0 4.0
# snapshots on all the mesh
SismoGrille = 0 0 0 AUTO 101 101 101
# diffracted and total field (in this test case, we compute only total field)
FileOutputGrille = diffracTest.dat totalTimeFente3D.dat

# tend tbegin deltat for snasphots on line
ParametersOutputLine = 0.0 20.0 1.0
# diffracted and total field (in this test case, we compute only total field)
FileOutputLine = diffracPoint.dat totalLine_Fente3D.dat
# you can add as many lines as you want, all the results will be stored in the same file totalLine_Fente.dat
SismoLine = -1.5 1.5 0.0 0.0 0.0 0.0 200

# snapshots on a subdivided mesh (AUTO means that number of subdivisions will be equal to order of approximation)
# only surfacic mesh (referenced triangles and quadrangles)
SismoMeshSurfacic = 10 REFERENCE ALL
# files where the snapshots on subdivided mesh are stored
FileOutputMeshSurfacic = diffrac_surfFente.bb total_surfTimeFente.bb
ParametersOutputMeshSurfacic = 0.0 20.0 4.0

# non-linear solver used to invert transformation Fi
NonLinearSolver = NEWTON 1e-15 50

# tend tbegin deltat for seismogramms
ParametersOutputPoint = 0.0 20.0 0.02
# diffracted and total field (in this test case, we compute only total field)
FileOutputPoint = diffracPoint.dat totalPoint_Fente3D.dat
# you can add as many points you want, all the results will be stored in the same file totalPoint.dat
SismoPoint = 1.0 0.0 0.0
SismoPoint = -1.0 0.0 0.0
SismoPoint = 0.0 0.0 0.0

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
# seismogramms are always on ascii format
OutputFormat = BINARY DOUBLE

# we want the solution U and gradients
ElectricOrMagnetic = 0

# steo time deltat
TimeStep = 0.04

# initial time of the experience, final time
TimeInterval = 0.0 20.0

# theta scheme or order two, applied on equation of order 2 (d^2 u/dt^2 - Delta u = f )
OrderTimeScheme = 2 THETA_SCHEME

# implicit scheme, we need to solve a linear system a each time step
# resolution of the linear system with direct method
TypeSolver = DIRECT

# temporal dependance of the source
TemporalSource = HARMONIC 60.0

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = acous3D.x 4 8
