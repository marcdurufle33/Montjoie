# type of finite element
TypeElement = HEXAHEDRON_LOBATTO
# type of equation
TypeEquation = HARMONIC_ELASTIC
# path where the meshes are stored
MeshPath = MAILLAGES/
# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 0.7 0.0
# incident angle teta of the incident plane wave \vec{k} = (k cos teta, k sin teta)
# this angle is in degrees (0, 90, 180 by example)
IncidentAngle = 0.0 0.0

# BALL a b nb_points ref REGULAR
FileMesh = BALL 2 3 2 1 REGULAR

TypeMesh = HEXA

# order of space approximation 
OrderDiscretization = 4

# extern boundary is a sphere
TypeCurve = 3 SPHERE

# boundary condition for faces of reference 3
ConditionReference = 3 NEUMANN

# several choices for selecting properties of a media 
# MateriauDielec = ref ISOTROPE rho lambda mu
# MateriauDielec = ref YOUNG_POISSON rho E nu
# MateriauDielec = ref ORTHOTROPE rho c0000 c0011 c0022 c1111 c1122 c2222 c0101 c0202 c1212
# MateriauDielec = ref ORTHOTROPE_POISSON rho Ex Ey Ez nu_xy nu_xz nu_yz Gxy Gxz Gxy
# MateriauDielec = ref ORTHOTROPE_POISSON rho Ex Ey Ez nu_xy nu_xz nu_yz Gxy Gxz Gxy ANGLE theta phi
# MateriauDielec = ref ANISOTROPE rho c0000 c0011 c0022 c0001 c0002 c0012 \
#                                     c1111 c1122 c1101 c1102 c1112 c2222 \
#                                     c2201 c2202 c2212 c0101 c0102 c0112 \
#                                     c0202 c0212 c1212
MateriauDielec = 1 ORTHOTROPE_POISSON 1.2 4.0 5.0 3.2  0.35 0.22 0.25 2.5 2.9 3.8 ANGLE 90 45
MateriauDielec = 2 ORTHOTROPE_POISSON 1.2 4.0 5.0 3.2  0.35 0.22 0.25 2.5 2.9 3.8 ANGLE 90 45

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 radius
# where (x0, y0) is the center of the gaussian, radius is so that f(radius) = 1e-6
TypeSource = SRC_VOLUME GAUSSIAN 0.0 0.0 0.0 1.4

Polarization = 0.707106 0.707106 0

# iterative resolution of the system
TypeResolution = BICGCR IDENTITY

NumberMaxIterations = 1000000 10

# non-linear solver to solve
NonLinearSolver = NEWTON 1e-15 50

# snapshots on a 2-D regular grid 200x200
SismoGrille = 0 0 0 AUTO 100 100 100
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputGrille = diffracCube totalSphereElas

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution U and gradients
ElectricOrMagnetic = -2

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat_

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 4

DataNonRegressionTest = harmonic_elas3D.x 0 8
