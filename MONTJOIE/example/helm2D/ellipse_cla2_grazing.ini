# type of finite element
TypeElement = QUADRANGLE_LOBATTO

# type of equation
TypeEquation = HELMHOLTZ

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 2.0 0.0

# incident angle teta of the incident plane wave \vec{k} = (k cos teta, k sin teta)
# this angle is in degrees (0, 90, 180 by example)
IncidentAngle = 90.0

# file where the mesh is stored (path is added -> MAILLAGES/DisqueCond_QUAD.mesh)
FileMesh = cond_ellipse.mesh

# Materiau
# MateriauDielec = ref ISOTROPE rho mu sigma
MateriauDielec = 1 ISOTROPE 1 1 0

# order of space approximation 
OrderDiscretization = 8

# curved element
TypeCurve = 1 ELLIPSE 0 0 0.5 5.0 
TypeCurve = 3 ELLIPSE 0 0 0.75 5.5

# boundary condition for edges of reference 1 and 3
ConditionReference = 1 DIRICHLET 
ConditionReference = 3 ABSORBING

# OrderAbsorbingBoundaryCondition = N 
OrderAbsorbingBoundaryCondition = 5 PARAMETERS 0.25 0.25 0.25 GRAZING
ModifiedImpedance = CURVE

# to define a body (for transparent condition)
TypeBody = 1 1

# diffracted field of a plane wave exp(ikx)
TypeSource = SRC_DIFFRACTED_FIELD PLANE_WAVE

# automatic resolution of the linear system (selection of the optimal algorithm)
TypeSolver = AUTO

# non-linear solver to invert transformation Fi
NonLinearSolver = NEWTON 1e-15 50

# snapshots on a 2-D regular grid 200x200
SismoPlane = AUTO 200 500
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputPlane = diffracEllipseClaKm2Grazing totalEllipseClaKm2Grazing

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution U and gradients
ElectricOrMagnetic = 0

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat_

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = helmholtz2D.x 0 1
