# type of finite element
TypeElement = TETRAHEDRON_FIRST_FAMILY

# type of equation
TypeEquation = HARMONIC_MAXWELL

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 2.0 0.0

# incident angles teta and phi of the incident plane wave \vec{k} = (k sin teta cos phi, k sin teta sin phi, k cos teta)
# this angle is in degrees (0, 90, 180 by example)
IncidentAngle = 0 0

# polarization of the source (Ex Ey Ez)
#Polarization = 0 1 0

# file where the mesh is stored
FileMesh = tuyau.exo

# purely hexahedral mesh
TypeMesh = HEXA

# order of space approximation 
OrderDiscretization = 4

# curves
#TypeCurve = 5 CYLINDER
#TypeCurve = 6 CYLINDER

# boundary conditions (Neumann for lateral boundaries, absorbing at right, dirichlet at left)
ConditionReference = 1 NEUMANN
ConditionReference = 2 DIRICHLET
ConditionReference = 3 ABSORBING

# SRC_MODE ref shift nb_modes_to_compute numero_mode amplitude boundary_condition
# ref is the reference mesh where the mode should be imposed
TypeSource = SRC_MODE 1 LAPLACE 0.1 4 0 1.0 NORMAL

# direct solver
TypeSolver = DIRECT

# non-linear solver to solve Fi(X) = Y
NonLinearSolver = NEWTON 1e-15 50

# snapshots on a 3-D regular grid 100x100x100 (on three planes)
SismoGrille = 0 0 0 AUTO 100 100 100
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputGrille = diffracTuyauMax totalTuyauMax

# output on meshes
SismoMeshVolumetric = AUTO
FileOutputMeshVolumetric = diffrac_TuyauMaxMesh.bb total_TuyauMaxMesh.bb

# Snapshots on lines
#SismoLine = 0.0 2.0 0.05 0.05 201
#FileOutputLine = diffracSection totalSection

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the component Ex of solution E
ElectricOrMagnetic = 0

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat_

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

#DataNonRegressionTest = maxwell3D.x 0 1
