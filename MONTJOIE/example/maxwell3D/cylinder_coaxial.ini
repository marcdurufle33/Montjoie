# type of finite element
TypeElement = HEXAHEDRON_FIRST_FAMILY

# type of equation
TypeEquation = HARMONIC_MAXWELL

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 1.0 0.0

# incident angles theta and phi
IncidentAngle = 180.0 0

# n is the number of layers, file_mesh is the 2-D mesh to be extruded
# p0, p1 ... p_{n-1} are the number of subdivisions in each layer
# FileMesh = EXTRUDE n z0 z1 ... zn file_mesh p0 p1 ... p_{n-1} nb_ref_surf ref1 ref2 ref3 .. ref_p nb_ref_vol ref1 ref2 ... ref_m
FileMesh = EXTRUDE 5 0.0 1.0 4.0 5.0 6.0 10.0 DisqueCoaxial.mesh 4 8 3 3 10    \
           4  5 0 3 4  0 0 0 0  5 0 3 4  7 7 0 0  5 0 3 4  9 9 0 0 5 0 3 4  8 8 0 0  5 0 3 4  6 6 0 0  2  1 2  1 2 1 2 1 2 1 2

# order of space approximation 
OrderDiscretization = 3

# purely hexahedral mesh
TypeMesh = HEXA

# curved elements
TypeCurve = 4 CYLINDER 0 0 0 0 0 1.0 0.1
TypeCurve = 5 CYLINDER 0 0 0 0 0 1.0 0.16
TypeCurve = 3 CYLINDER 0 0 0 0 0 1.0 0.2

# boundary conditions
ConditionReference = 1 2 DIRICHLET
ConditionReference = 3 DIRICHLET
ConditionReference = 4 DIRICHLET
ConditionReference = 6 ABSORBING

# epsilon mu and sigma
MateriauDielec = 1 ISOTROPE 1 1
MateriauDielec = 2 ISOTROPE 2 1 0.5

# TypeSource = SRC_MODE ref1 ref2 ... refn POISSON nb_pot NORMAL ref1 val1 ref2 val2
TypeSource = SRC_MODE 1 2 POISSON 2 4 0.0 3 1.0  1.0

# iterative resolution with SSOR as preconditioning
#TypeResolution = BICGCR SSOR 1.0

# too slow, direct solver instead
TypeSolver = DIRECT

# NumberMaxIterations = nb_iter_max restart
NumberMaxIterations = 20000 10

# stopping criterion
Tolerance = 1e-7

# non-linear solver to solve Fi(X) = Y
NonLinearSolver = NEWTON 1e-15 50

# snapshots on a 3-D regular grid 200x200x200 (only three planes, not all the volume)
SismoGrille = 0.0 0.0 5.0 AUTO 200 200 200
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputGrille = diffracCylinderCoaxial totalCylinderCoaxial

# ParametersOutputPlane = t0 tf dt
ParametersOutputPlane = 0.0 10.0 0.1
# SismoPlane = x0 y0 z0   x1 y1 z1   x2 y2 z2   nx ny
# The grid points are placed in the quadrilateral 
# with points (x0, y0, z0), (x1, y1, z1), (x2, y2, z2)
# and (x1 + x2 - 2 x0, y1 + y2 - 2 y0, z1 + z2 - 2 z0)
SismoPlane = -0.2 -0.2 4.0  0.2 -0.2 4.0  -0.2 0.2 4.0  200 200
SismoPlane = -0.2 -0.2 5.0  0.2 -0.2 5.0  -0.2 0.2 5.0  200 200
SismoPlane = -0.2 -0.2 6.0  0.2 -0.2 6.0  -0.2 0.2 6.0  200 200
# file name for diffracted field and total field
FileOutputPlane = diffracPlane totalCylinderCoaxialPlane

# iterative matrix is not stored
ExplicitMatrixFEM = NO

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution E only
ElectricOrMagnetic = -2

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = maxwell3D.x 0 1
