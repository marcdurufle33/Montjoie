# type of finite element
TypeElement = HEXAHEDRON_FIRST_FAMILY

# type of equation
TypeEquation = HARMONIC_MAXWELL

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 1.0 0.0

# incident angles theta and phi
IncidentAngle = 180.0 0

# file where the mesh is stored
FileMesh = cobra.mesh

# purely hexahedral mesh
TypeMesh = HEXA

# order of space approximation 
OrderDiscretization = 4

# Dirichlet condition on reference 2
ConditionReference = 2 DIRICHLET

# Silver-Muller condition on reference 3
ConditionReference = 3 ABSORBING

# Dirichlet condition on lateral faces
ConditionReference = 1 4 5 6 7 DIRICHLET

# uncomment if Montjoie is compiled with GSL
#TypeCurve = 4 CYLINDER
#TypeCurve = 5 CYLINDER
#TypeCurve = 6 CYLINDER
#TypeCurve = 7 CYLINDER

# MateriauDielec = 1 ISOTROPE epsilon and mu
MateriauDielec = 1 ISOTROPE 1 1

# Gaussian source : TypeSource = SRC_VOLUME CURL_GAUSSIAN x0 y0 z0 radius
TypeSource = SRC_VOLUME CURL_GAUSSIAN 0.0 0.5 1.4 1.2

# dipole oriented along e_x
Polarization = 1.0 0 0

# conjugate gradient solver with low-order preconditioning
TypeResolution = COCG LOW_ORDER

# NumberMaxIterations = nb_iter_max restart
NumberMaxIterations = 100000 10

# stopping criterion for COCG algorithm
Tolerance = 1e-8

# iterative matrix is not stored
ExplicitMatrixFEM = NO

# non-linear solver to solve Fi(X) = Y
NonLinearSolver = NEWTON 1e-15 50

# snapshots on a 3-D regular grid 200x200x200 (only three planes, not all the volume)
SismoGrille = 2.5 0.25 1.5 AUTO 200 200 200
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputGrille = diffracCobraMax totalCobraMax

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution E only
ElectricOrMagnetic = -2

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat.dat

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 6

DataNonRegressionTest = maxwell3D.x 0 1
