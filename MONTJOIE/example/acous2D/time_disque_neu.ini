TypeElement = QUADRANGLE_LOBATTO
#TypeElement = QUADRANGLE_DG_LOBATTO
TypeEquation = ACOUSTIC
# path where the meshes are stored
MeshPath = MAILLAGES/
# frequency of the temporal source
# Frequency = a b means that the pulsation omega = 2*pi*a + b 
Frequency = 1.0 0.0

# file where the ;esh is stored
FileMesh = disquePML.mesh

TypeMesh = QUAD

# order of space approximation
OrderDiscretization = 4

# boundary condition for edges of reference 3
ConditionReference = 3 ABSORBING
ConditionReference = 1 NEUMANN

MateriauDielec = 1 ISOTROPE 0.8 1.2 0.0

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 radius
# where (x0, y0) is the center of the gaussian, radius is so that f(radius) = 1e-6
TypeSource = SRC_VOLUME GAUSSIAN -1.5 0.0 0.6

# initial time, final time, and step time between each snapshot
# tend tbegin deltat
ParametersOutputPlane = 0.0 40.0 4.0
# snapshots on all the mesh
SismoPlane = AUTO 200 200
# diffracted and total field (in this test case, we compute only total field)
FileOutputPlane = diffracTest.dat totalTimeDisqueNeu.dat

# tend tbegin deltat for snasphots on line
ParametersOutputCircle = 0.0 40.0 0.1
# diffracted and total field (in this test case, we compute only total field)
FileOutputCircle = diffracPoint.dat totalCircle_Neu.dat
# you can add as many circles you want, all the results will be stored in the same file totalCircle_Neu.dat
SismoCircle = 0.0 0.0 1.5 200

# tend tbegin deltat for seismogramms
ParametersOutputPoint = 0.0 40.0 0.02
# diffracted and total field (in this test case, we compute only total field)
FileOutputPoint = diffracPoint.dat totalPoint_DisqueNeu.dat
# you can add as many points you want, all the results will be stored in the same file totalPoint_Neu.dat
SismoPoint = 1.5 0.0
SismoPoint = -1.5 0.0

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
# seismogramms are always on ascii format
OutputFormat = BINARY DOUBLE

# we want the solution U and gradients
ElectricOrMagnetic = 0

# steo time deltat
TimeStep = 0.0025

# initial time of the experience, final time
TimeInterval = 0.0 20.0

# theta scheme or order two, applied on equation of order 2 (d^2 u/dt^2 - Delta u = f )
OrderTimeScheme = 2 LEAP_FROG_PML

AddPML = YES PML_XY 1.0 AUTO
DampingPML = 2.0

# temporal dependance of the source
TemporalSource = RICKER

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = acous2D.x 4 8
