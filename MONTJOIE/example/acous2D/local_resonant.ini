# finite element used
TypeElement = QUADRANGLE_LOBATTO

# solved equation
TypeEquation = ACOUSTIC_HDG

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency of the temporal source
# Frequency = a b means that the pulsation omega = 2*pi*a + b 
Frequency = 8.0 0.0

# incident angle
IncidentAngle = 0.0

# file where the mesh is stored in the folder specified by MeshPath
FileMesh = DisqueResonant.mesh

# order of space approximation
OrderDiscretization = 10

# boundary conditions
ConditionReference = 1 ABSORBING
ConditionReference = 2 4 5 NEUMANN

# RefinementVertex = x0 y0 level ratio
RefinementVertex = -4.999238475781956e-01  8.726203218641719e-03  5 4.0
RefinementVertex = -4.999238475781956e-01  -8.726203218641719e-03  5 4.0
RefinementVertex = -9.999619259638773e-01  8.726203218641719e-03 5 4.0
RefinementVertex = -9.999619259638773e-01  -8.726203218641719e-03 5 4.0

# TypeCurve = ref CIRCLE
TypeCurve = 1 2 3 4 CIRCLE

# MateriauDielec = 1 ISOTROPE rho mu sigma
MateriauDielec = 1 ISOTROPE 0.8 1.2 0.0
MateriauDielec = 2 ISOTROPE 1.0 1.0 0.0

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 radius
# where (x0, y0) is the center of the gaussian, radius is so that f(radius) = 1e-6

# plane wave : TypeSource = SRC_TOTAL_FIELD AUTO
TypeSource = SRC_TOTAL_FIELD AUTO

# il faut toujours utiliser de la condensation statique (matrices plus petites)
StaticCondensation = YES Store

# cas ou on utilise un solveur direct
TypeSolver = DIRECT

# initial time, final time, and step time between each snapshot
# tend tbegin deltat
ParametersOutputPlane = 0.0 10.0 1.0
# snapshots on all the mesh
SismoPlane = AUTO 200 200
# diffracted and total field (in this test case, we compute only total field)
FileOutputPlane = diffracLocalDisqueResonant.dat totalLocalDisqueResonant.dat

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
# seismogramms are always on ascii format
OutputFormat = BINARY DOUBLE

# we want the solution U only
ElectricOrMagnetic = 0

# TimeStep = dt FILE nom_fichier
# on indique le fichier ou sont stockes les "pas de temps" pour chaque element
TimeStep = 0.0004 FILE DATA/local_dt_resonant.don

# pour regenerer le fichier local_dt_resonant.don
# MeshSizeFace est ici un critere purement geometrique
MethodEvaluationCFL = MeshSizeFace

# initial time of the experience, final time
TimeInterval = 0.0 10.01

# pas de temps local base sur du Runge-Kutta
# OrderTimeScheme order LOCAL_IMPLICIT nb_extra type_schema order_imp extra_imp AUTO dt_seuil
# nb_extra est le nombre d'etapes additionnelles pour le RK explicite
# type_schema vaut Pade ou LinearSdirk
# order_imp est l'ordre desire pour le schema implicite
# extra_imp est le nombre d'etapes additionnelles pour le schema implicite
# dt_seuil est le pas de temps a partir duquel on choisit de l'explicite
# dans le cas MeshSizeFace, comme ca renvoit a h, ce parametre n'a pas de relation claire avec le pas de temps
OrderTimeScheme = 4 LOCAL_IMPLICIT_RK 2 LinearSdirk 4 1 AUTO 0.01

# temporal dependance of the source
# TemporalSource = RICKER
TemporalSource = SINUS_GAUSSIAN 4.0

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 4

DataNonRegressionTest = acous2D.x 4 1
