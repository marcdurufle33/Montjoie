TypeElement = QUADRANGLE_LOBATTO
#TypeElement = QUADRANGLE_DG_LOBATTO
TypeEquation = ACOUSTIC
# path where the meshes are stored
MeshPath = MAILLAGES/
# frequency of the temporal source
# Frequency = a b means that the pulsation omega = 2*pi*a + b 
Frequency = 3.0 0.0

FileMesh = mesh_square_hole_120.mesh

# order of space approximation
OrderDiscretization = 7

# boundary condition for edges of reference 3
ConditionReference = 1 ABSORBING
ConditionReference = 2 3 DIRICHLET

# Define the constants of the material (rho mu sigma)
MateriauDielec = 1 ISOTROPE 1.0 2.25 0.0

# add PML layer
PresencePML = YES
AddPML = YES PML_XY 1.0 AUTO
DampingPML = 2.0

# Gaussian source : TypeSource = SRC_VOLUME RANDOM_GAUSSIAN xm xM ym yM radius
# where center of the gaussian is included in box (xm,xM)*(ym,yM), radius is
# so that f(radius) = 1e-6
TypeSource = SRC_VOLUME RANDOM_GAUSSIAN 0.0 2.5 -25.0 25.0 1.0

# tend tbegin deltat for seismogramms
ParametersOutputPoint = 0.0 100.0 0.01
# diffracted and total field (in this test case, we compute only total field)
FileOutputPoint = diffracPoint.dat totalPointCarre.dat
# you can add as many points you want, all the results will be stored in the same file totalPoint.dat
SismoPoint = 40.0 0.25
SismoPoint = 40.0 0.75
SismoPoint = 40.0 1.25
SismoPoint = 40.0 1.75
SismoPoint = 40.0 2.25
SismoPoint = 40.0 -0.25
SismoPoint = 40.0 -0.75
SismoPoint = 40.0 -1.25
SismoPoint = 40.0 -1.75
SismoPoint = 40.0 -2.25
SismoPoint = 40.0 2.75
SismoPoint = 40.0 3.25
SismoPoint = 40.0 3.75
SismoPoint = 40.0 4.25
SismoPoint = 40.0 4.75
SismoPoint = 40.0 -2.75
SismoPoint = 40.0 -3.25
SismoPoint = 40.0 -3.75
SismoPoint = 40.0 -4.25
SismoPoint = 40.0 -4.75

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE
# (simple or double precision)
# sismogramms are always on ascii format
OutputFormat = BINARY DOUBLE

# we want only the solution U (not the gradient)
ElectricOrMagnetic = 0

# step time deltat
TimeStep = 0.01

# initial time of the experience, final time
TimeInterval = -1.0 100.0

# leap-frog scheme or order four, applied on equation of order 2 (d^2 u/dt^2
# - Delta u = f ) with PML
OrderTimeScheme = 4 LEAP_FROG_PML

# temporal dependance of the source
TemporalSource = RANDOM_MODULATED_CARDINAL_COSINUS 0.0 100.0 0.01

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

# Cross correlation post treatment
ComputationBox = 15.0 25.0 -5.0 5.0
DiscretizationBox = 2000 2000
PictureOutputFilename = CrossPicture
CrossCorrelationOutputFilename = CrossComputation
LightConfiguration = Both
HomogeneousVelocity = 1.5