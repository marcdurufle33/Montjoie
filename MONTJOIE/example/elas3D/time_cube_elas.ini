TypeElement = HEXAHEDRON_LOBATTO
TypeEquation = TIME_ELASTIC
# path where the meshes are stored
MeshPath = ./
# frequency of the temporal source
# Frequency = a b means that the pulsation omega = 2*pi*a + b 
Frequency = 1.0 0.0

# for a regular mesh, put FileMesh = REGULAR nb_x xmin xmax ymin ymax zmin zmax ref_media  ref1 ref2 ref3 ref4 ref5 ref6
# nb_x : number of subdivisions along x
# ref_media reference of the elements (hexahedra or tetrahedra)
# ref1, ref2, ref3, ref4, ref5, ref6 references of the boundaries
FileMesh = REGULAR 11 -5.0  5.0  -5.0  5.0  -5.0 5.0  1  3  3  3  3  3  3

TypeMesh = HEXA

# order of space approximation
OrderDiscretization = 7

# boundary condition for edges of reference 3
ConditionReference = 3 DIRICHLET

# several choices for selecting properties of a media 
# MateriauDielec = ref ISOTROPE rho lambda mu
# MateriauDielec = ref YOUNG_POISSON rho E nu
# MateriauDielec = ref ORTHOTROPE rho c0000 c0011 c0022 c1111 c1122 c2222 c0101 c0202 c1212
# MateriauDielec = ref ANISOTROPE rho c0000 c0011 c0022 c0001 c0002 c0012 \
#                                     c1111 c1122 c1101 c1102 c1112 c2222 \
#                                     c2201 c2202 c2212 c0101 c0102 c0112 \
#                                     c0202 c0212 c1212
MateriauDielec = 1 ISOTROPE 1.0 4.0 2.0

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 radius
# where (x0, y0) is the center of the gaussian, radius is so that f(radius) = 1e-6
TypeSource = SRC_VOLUME GAUSSIAN 0.0 0.0 0.0 2.8

Polarization = 1.0 0.0 0.0

# initial time, final time, and step time between each snapshot
# tend tbegin deltat
ParametersOutputGrille = 0.0 1000.0 2.0
# snapshots on all the mesh
#SismoPlane = -20 20 -20 20 200 200
SismoGrille = 0 0 0 AUTO 200 200 200
# diffracted and total field (in this test case, we compute only total field)
FileOutputGrille = diffracTest.dat totalTimeCubeElas.dat

# tend tbegin deltat for seismogramms
ParametersOutputPoint = 0.0 40.0 0.02
# diffracted and total field (in this test case, we compute only total field)
FileOutputPoint = diffracPoint.dat totalPoint_CubeElas.dat
# you can add as many points you want, all the results will be stored in the same file totalPoint.dat
SismoPoint = 0.5 0.0 0.0
SismoPoint = 2.5 0.0 0.0

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
# seismogramms are always on ascii format
OutputFormat = BINARY DOUBLE

# we want only the solution U (not the gradient)
ElectricOrMagnetic = 0

# steo time deltat
TimeStep = 0.01

# initial time of the experience, final time
TimeInterval = 0.0 10.1

# leap-frog scheme or order two, applied on equation of order 2 (d^2 u/dt^2 - Delta u = f )
OrderTimeScheme = 2 LEAP_FROG

# temporal dependance of the source
TemporalSource = RICKER

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 6

DataNonRegressionTest = elas3D.x 4 8
