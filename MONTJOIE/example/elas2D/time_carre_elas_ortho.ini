TypeElement = QUADRANGLE_LOBATTO
TypeEquation = TIME_ELASTIC
# path where the meshes are stored
MeshPath = ./
# frequency of the temporal source
# Frequency = a b means that the pulsation omega = 2*pi*a + b 
Frequency = 1.0 0.0

# for a regular mesh, put FileMesh = REGULAR nb_x xmin xmax ymin ymax  ref_media  ref1 ref2 ref3 ref4
# nb_x : number of subdivisions along x
# ref_media reference of the elements (quadrilaterals or triangles)
# ref1, ref2, ref3, ref4 references of the edges y = ymin, x = xmax, y = ymax and x = xmin
FileMesh = REGULAR 41 -10.0  10.0  -10.0  10.0  1  3  3  3  3

TypeMesh = QUAD

# order of space approximation
OrderDiscretization = 4

# boundary condition for edges of reference 3
ConditionReference = 3 NEUMANN

# several choices for selecting properties of a media 
#MateriauDielec = ref ISOTROPE rho lambda mu
#MateriauDielec = ref YOUNG_POISSON rho E nu
#MateriauDielec = ref ORTHOTROPE rho c0000 c0011 c1111 c0101
#MateriauDielec = ref ORTHOTROPE_POISSON rho Ex Ey nu_xy Gxy
#MateriauDielec = ref ORTHOTROPE_POISSON rho Ex Ey nu_xy Gxy ANGLE theta
#MateriauDielec = ref ANISOTROPE rho c0000 c0011 c0001 c1111 c1101 c0101
MateriauDielec = 1 ORTHOTROPE_POISSON 1.0 10.0 2.0 0.3 2.5 ANGLE 45

# Gaussian source : TypeSource = SRC_VOLUME GAUSSIAN x0 y0 radius
# where (x0, y0) is the center of the gaussian, radius is so that f(radius) = 1e-6
TypeSource = SRC_VOLUME GAUSSIAN 0.0 0.0 2.0

Polarization = 0.707106 0.707106

# initial time, final time, and step time between each snapshot
# tend tbegin deltat
ParametersOutputPlane = 0.0 1000.0 2.0
# snapshots on all the mesh
SismoPlane = AUTO 201 201
# diffracted and total field (in this test case, we compute only total field)
FileOutputPlane = diffracTest.dat totalTimeCarreElasOrtho.dat

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
# seismogramms are always on ascii format
OutputFormat = BINARY DOUBLE

# we want only the solution U (not the gradient)
ElectricOrMagnetic = -2

# steo time deltat
TimeStep = 0.005

# initial time of the experience, final time
TimeInterval = 0.0 10.0

# leap-frog scheme or order two, applied on equation of order 2 (d^2 u/dt^2 - Delta u = f )
OrderTimeScheme = 2 LEAP_FROG_PML

# temporal dependance of the source
TemporalSource = RICKER

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 6

DataNonRegressionTest = elas2D.x 4 8
