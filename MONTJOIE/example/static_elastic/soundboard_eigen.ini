# type of finite element
TypeElement = HEXAHEDRON_LOBATTO
# type of equation
TypeEquation = HELMHOLTZ
# path where the meshes are stored
#MeshPath = /home/durufle/Maillages/Surf/Piano/
MeshPath = /home/durufle/Maillages/3D/Piano/
# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 1.0 0.0
# incident angle teta of the incident plane wave \vec{k} = (k cos teta, k sin teta)
# this angle is in degrees (0, 90, 180 by example)
IncidentAngle = 90.0 0.0

# for a regular mesh, put FileMesh = REGULAR nb_x xmin xmax ymin ymax zmin zmax  ref_media  ref1 ref2 ref3 ref4 ref5 ref6
# nb_x : number of subdivisions along x
# ref_media reference of the elements (hexahedrals or tetrahedrals)
# ref1, ref2, ref3, ref4, ref5, ref6 references of the faces x = xmin, y = ymin, z = zmin, z = zmas, y = ymax and x = xmax
#FileMesh = REGULAR 5 -1.0  1.0  -1.0  1.0  -0.02 0.02  1  3  3  2  2  3  3 
#FileMesh = EXTRUDE 1 -0.02 0.02 soundboard.mesh 1   3  0 1 0 0 4 4  3 0 1 1
FileMesh = soundboard-3d.mesh

#TypeMesh = HEXA

# order of space approximation 
OrderDiscretization = 2

# boundary condition for edges of reference 3
#ConditionReference = 1 DIRICHLET
#ConditionReference = 2 3 4 NEUMANN

ConditionReference = 5 DIRICHLET
ConditionReference = 1 2 3 4 6 NEUMANN

# Eigenvalue = YES mode center_spectrum nb_modes
Eigenvalue = YES SHIFTED 0.1 10
#Eigenvalue = YES CAYLEY 0.5 10
EigenvalueTolerance = 1e-6

MateriauDielec = 1 ISOTROPE 1.0 4.0 2.0
MateriauDielec = 2 ISOTROPE 1.0 4.0 2.0
MateriauDielec = 3 ISOTROPE 1.0 4.0 2.0

# automatic resolution of the linear system (selection of the optimal algorithm)
#TypeSolver = AUTO
TypeResolution = PASTIX
NbThreadsPerNode = 8

# non-linear solver to invert transformation Fi
NonLinearSolver = NEWTON 1e-15 50

# snapshots on a 2-D regular grid 200x200
SismoGrille = 0 0 0 AUTO 200 200 200
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputGrille = diffracTest ModeSoundboardP2_

# ASCII or BINARY (binary needs less memory), FLOAT or DOUBLE (simple or double precision)
OutputFormat = BINARY DOUBLE

# we want to know the solution U and gradients
ElectricOrMagnetic = -1

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat_

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 3

