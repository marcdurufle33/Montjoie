# type of finite element
TypeElement = TRIANGLE_CLASSICAL

# type of equation
TypeEquation = HARMONIC_AEROACOUSTIC

# path where the meshes are stored
MeshPath = ./

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 0.78 0.0

# IndicentAngle = theta phi of the indicent plane wave
# wave vector k = (k sin teta cos phi, k sin teta sin phi, k cos teta)
IncidentAngle = 180.0 0.0

# file where the mesh is stored (path is added -> MAILLAGES/DemiDisquePML.mesh)
FileMesh = REGULAR 15 0.0 4.0   -4.0 4.0   1   1 2 3 4

# order of space approximation 
OrderDiscretization = 10

# Bogey-Bailly-Juve model
EnergyConservingAeroacousticModel = BogeyBaillyJuve

# Penalty coefficients
PenalizationDG = -1.0 -1.0

# only modes 0, -1, and 1 are solved
NumberModes = 1

# absorbing condition for r = 4
ConditionReference = 2 4 ABSORBING
# periodic condition for z=-4 and z=4
ConditionReference = 1 3 PERIODICITY

# physical media
PhysicalMedia = sigma 1 ISOTROPE 0.1
PhysicalMedia = rho0 1 ISOTROPE SAME_MESH DATA/carreDemi.mesh 0 1.0 DATA/RhoAxiPer_Cylinder.don 10 1.0
PhysicalMedia = c0 1 ISOTROPE SAME_MESH DATA/carreDemi.mesh 0 1.0 DATA/C0AxiPer_Cylinder.don 10 1.0
PhysicalMedia = p0 1 ISOTROPE SAME_MESH DATA/carreDemi.mesh 0.0 1.0 DATA/P0AxiPer_Cylinder.don 10 1.0
PhysicalMedia = M 1 ISOTROPE SAME_MESH DATA/carreDemi.mesh 0 0.2 DATA/MrAxiPer_Cylinder.don 10 1.0 \
                            SAME_MESH DATA/carreDemi.mesh 0 0.2 DATA/MphiAxiPer_Cylinder.don 10 1.0 \
                            SAME_MESH DATA/carreDemi.mesh 0 0.2 DATA/MzAxiPer_Cylinder.don 10 1.0

# Gaussian source
TypeSource = SRC_VOLUME GAUSSIAN 0 0 0   1.0 2.0

# source in ux
Polarization = 0.0 1.0 0 0.0

# automatic resolution of the linear system (selection of the optimal algorithm)
TypeSolver = AUTO

# snapshots on a 2-D regular grid 200x200
SismoPlaneAxi = 1e-12 0.0 -4.0  4.0 0.0 -4.0   1e-12 0.0 4.0  200 400
# files where the diffracted and total field will be stored (extension .dat is added)
FileOutputPlaneAxi = diffracTestGhost totalAeroAxiCylinderPerBogey

# we want to know the solution U only
ElectricOrMagnetic = -2

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat.dat

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = aero_axi.x 0 8

