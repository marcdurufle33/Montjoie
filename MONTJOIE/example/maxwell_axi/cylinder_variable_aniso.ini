# type of finite element
TypeElement = QUADRANGLE_HCURL_AXI

# type of equation
TypeEquation = HARMONIC_MAXWELL

# path where the meshes are stored
MeshPath = MAILLAGES/

# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 1.0 0.0

# IndicentAngle = theta phi of the indicent plane wave
# wave vector k = (k sin teta cos phi, k sin teta sin phi, k cos teta)
IncidentAngle = 180.0 0.0

# use of modified formulation (better for modes 1 and -1)
ModifiedFormulation = YES

# Regular mesh
FileMesh = REGULAR 11 0 2.0 -2.0 2.0   1  3 3 3 2

# order of space approximation 
OrderDiscretization = 10

# individual selection of a mode
NumberModes = SINGLE -1

# uniform indices
#MateriauDielec = 1 ISOTROPE 1.2 1.5 0.1

# isotropic case
#PhysicalMedia = sigma 1 ISOTROPE SAME_MESH carre.mesh 0.0 1.0 sigma.don 10 1.0
#PhysicalMedia = mu 1 ISOTROPE SAME_MESH carre.mesh 0.0 1.0 mu_rr.don 10 1.0
#PhysicalMedia = epsilon 1 ISOTROPE SAME_MESH carre.mesh 0.0 1.0 eps_rr.don 10 1.0

# orthotropic case
#PhysicalMedia = sigma 1 ISOTROPE SAME_MESH carre.mesh 0.0 1.0 sigma.don 10 1.0
#PhysicalMedia = mu 1 ORTHOTROPE SAME_MESH carre.mesh 0.0 1.0 mu_rr.don 10 1.0 \
#                                SAME_MESH carre.mesh 0.0 1.0 mu_teta.don 10 1.0 \
#                                SAME_MESH carre.mesh 0.0 1.0 mu_zz.don 10 1.0

#PhysicalMedia = epsilon 1 ORTHOTROPE SAME_MESH carre.mesh 0.0 1.0 eps_rr.don 10 1.0 \
#                                     SAME_MESH carre.mesh 0.0 1.0 eps_teta.don 10 1.0 \
#                                     SAME_MESH carre.mesh 0.0 1.0 eps_zz.don 10 1.0

# anisotropic case
# mu_{r, theta}, mu_{z, theta}, eps_{r, theta}, eps_{z, theta} have to be equal to 0
PhysicalMedia = sigma 1 ISOTROPE SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/sigma_maxAxi.don 10 1.0
PhysicalMedia = mu 1 ANISOTROPE SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/mu_rr_maxAxi.don 10 1.0 \
                                0.0 \
                                SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/mu_rz_maxAxi.don 10 1.0 \
                                SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/mu_teta_maxAxi.don 10 1.0 \
                                0.0 \
                                SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/mu_zz_maxAxi.don 10 1.0

PhysicalMedia = epsilon 1 ANISOTROPE SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/eps_rr_maxAxi.don 10 1.0 \
                                     0.0 \
                                     SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/eps_rz_maxAxi.don 10 1.0 \
                                     SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/eps_teta_maxAxi.don 10 1.0 \
                                     0.0 \
                                     SAME_MESH DATA/carreMax.mesh 0.0 1.0 DATA/eps_zz_maxAxi.don 10 1.0

# Neumann boundary condition
ConditionReference = 2 3 NEUMANN

# Gaussian source
TypeSource = SRC_VOLUME GAUSSIAN 0.0 0 0 1.0

# polarization E0 of the source
Polarization = 1.0 0 0.0

# automatic resolution of the linear system (selection of the optimal algorithm)
TypeSolver = AUTO

# output on a 3-D plane
SismoPlaneAxi = 1e-12 0 -2.0  2.0 0 -2.0  1e-12 0 2.0   100 200
FileOutputPlaneAxi = diffracTest totalCylinderVarMaxAxi

# we want to know the electric field E and magnetic field H
ElectricOrMagnetic = -1

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat.dat

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = maxwell_axi.x 0 8
