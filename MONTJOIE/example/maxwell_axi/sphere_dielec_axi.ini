# type of finite element
TypeElement = QUADRANGLE_HCURL_AXI
# type of equation
TypeEquation = HARMONIC_MAXWELL
# path where the meshes are stored
MeshPath = MAILLAGES/
# frequency and/or pulsation
# Frequency = a b
# sets the pulsation omega = 2*pi*a + b
Frequency = 1.0 0.0
# IndicentAngle = theta phi of the indicent plane wave
# wave vector k = (k sin teta cos phi, k sin teta sin phi, k cos teta)
IncidentAngle = 180.0 0.0

# file where the mesh is stored (path is added -> MAILLAGES/DemiDisqueDielecPML.mesh)
FileMesh = DemiDisqueDielecPML.mesh

# order of space approximation 
OrderDiscretization = 7

# curved elements
TypeCurve = 4 CIRCLE

# PML are added for y < ymin and y > ymax
# and x > xmax (since we consider half-plane region in axisymmetric computation)
AddPML = YES PML_X+Y 1.0 AUTO
DampingPML = 2.0

# boundary condition for edges of reference 3
ConditionReference = 3 ABSORBING

# On the axis, a fictitious Neumann boundary condition is set
ConditionReference = 2 NEUMANN

# outside, vaccuum, epsilon = mu = 1
MateriauDielec = 1 ISOTROPE 1 1
# dielectric sphere, with complex values for epsilon and mu
MateriauDielec = 2 ISOTROPE (2.0,0.25) (1.5,0.1)

# diffracted field of a plane wave exp(ikx)
TypeSource = SRC_DIFFRACTED_FIELD PLANE_WAVE

# polarization E0 of the plane wave
Polarization = 1.0 0 0

# automatic resolution of the linear system (selection of the optimal algorithm)
TypeSolver = AUTO

# snapshots on three planes intersecting at (0, 0, 0)
SismoGrille = 0 0 0 -2 2 -2 2 -2 2 100 100 100
# files where the diffracted and total field will be stored
FileOutputGrille = diffracSphereAxiDielec totalSphereAxiDielec

# we want to know the electric field E
ElectricOrMagnetic = -2

# put YES if you want to store the matrix on the disk
StorageMatrix = NO mat.dat

# level of display (-1 for no display, 0 for minimal display, 10 for debug ...)
PrintLevel = 2

DataNonRegressionTest = maxwell_axi.x 0 8
